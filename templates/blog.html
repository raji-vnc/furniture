<!doctype html>
<html lang="en">
<head>
  {% load static %}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="shortcut icon" href="{% static 'favicon.png' %}">
  <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <link href="{% static 'css/tiny-slider.css' %}" rel="stylesheet">
  <link href="{% static 'css/style.css' %}" rel="stylesheet">
  <title>Blog | Furni</title>
</head>
<body>
  <nav class="custom-navbar navbar navbar-expand-md navbar-dark bg-dark" arial-label="Furni navigation bar">
    <div class="container">
      <a class="navbar-brand" href="{% url 'products:index' %}">Furni<span>.</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarsFurni" aria-controls="navbarsFurni" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarsFurni">
        <ul class="custom-navbar-nav navbar-nav ms-auto mb-2 mb-md-0">
          <li><a class="nav-link" href="{% url 'products:index' %}">Home</a></li>
          <li><a class="nav-link" href="{% url 'products:products' %}">Shop</a></li>
          <li><a class="nav-link" href="{% url 'products:services' %}">Services</a></li>
          <li class="active"><a class="nav-link" href="{% url 'products:blog' %}">Blog</a></li>
          <li><a class="nav-link" href="{% url 'products:contact' %}">Contact us</a></li>
        </ul>
        <ul class="custom-navbar-cta navbar-nav mb-2 mb-md-0 ms-5">
          <li><a class="nav-link" href="{% if request.user.is_authenticated %}{% url 'accounts:profile' %}{% else %}{% url 'accounts:signin' %}{% endif %}"><img src="{% static 'images/user.svg' %}"></a></li>
          <li><a class="nav-link" href="{% url 'cart:cart_view' %}"><img src="{% static 'images/cart.svg' %}"></a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="hero">
    <div class="container">
      <div class="row justify-content-between">
        <div class="col-lg-5">
          <div class="intro-excerpt">
            <h1>Blog</h1>
            <p class="mb-4">Latest furniture ideas, care tips, and home inspiration from the Furni team.</p>
          </div>
        </div>
        <div class="col-lg-7">
          <div class="hero-img-wrap">
            <img src="{% static 'images/couch.png' %}" class="img-fluid" alt="Couch">
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="blog-section">
    <div class="container">
      <div class="row mb-4">
        <div class="col-lg-7">
          <h2 class="section-title">Stories and Updates</h2>
        </div>
      </div>
      <div id="blog-status" class="text-muted mb-3"></div>
      <div class="row" id="blog-list">
        <div class="col-12">
          <p class="text-muted">Loading blog posts...</p>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer-section">
    <div class="container relative">
      <div class="sofa-img">
        <img src="{% static 'images/sofa.png' %}" alt="Image" class="img-fluid">
      </div>
    </div>
  </footer>

  <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'js/tiny-slider.js' %}"></script>
  <script src="{% static 'js/custom.js' %}"></script>
  <script src="{% static 'js/blog-page.js' %}"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  {% load static %}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="shortcut icon" href="{% static 'favicon.png' %}">
  <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <link href="{% static 'css/tiny-slider.css' %}" rel="stylesheet">
  <link href="{% static 'css/style.css' %}" rel="stylesheet">
  <title>Contact | Furni</title>
</head>
<body>
  <nav class="custom-navbar navbar navbar-expand-md navbar-dark bg-dark" arial-label="Furni navigation bar">
    <div class="container">
      <a class="navbar-brand" href="{% url 'products:index' %}">Furni<span>.</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarsFurni" aria-controls="navbarsFurni" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarsFurni">
        <ul class="custom-navbar-nav navbar-nav ms-auto mb-2 mb-md-0">
          <li><a class="nav-link" href="{% url 'products:index' %}">Home</a></li>
          <li><a class="nav-link" href="{% url 'products:products' %}">Shop</a></li>
          <li><a class="nav-link" href="{% url 'products:services' %}">Services</a></li>
          <li><a class="nav-link" href="{% url 'products:blog' %}">Blog</a></li>
          <li class="active"><a class="nav-link" href="{% url 'products:contact' %}">Contact us</a></li>
        </ul>
        <ul class="custom-navbar-cta navbar-nav mb-2 mb-md-0 ms-5">
          <li><a class="nav-link" href="{% if request.user.is_authenticated %}{% url 'accounts:profile' %}{% else %}{% url 'accounts:signin' %}{% endif %}"><img src="{% static 'images/user.svg' %}"></a></li>
          <li><a class="nav-link" href="{% url 'cart:cart_view' %}"><img src="{% static 'images/cart.svg' %}"></a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="hero">
    <div class="container">
      <div class="row justify-content-between">
        <div class="col-lg-5">
          <div class="intro-excerpt">
            <h1>Contact Us</h1>
            <p class="mb-4">Send us your questions, design requests, or product feedback and we will get back to you.</p>
          </div>
        </div>
        <div class="col-lg-7">
          <div class="hero-img-wrap">
            <img src="{% static 'images/couch.png' %}" class="img-fluid" alt="Couch">
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="untree_co-section">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-8 pb-4">
          <div class="row mb-5">
            <div class="col-lg-4">
              <div class="service no-shadow align-items-center link horizontal d-flex active">
                <div class="service-icon color-1 mb-4"><i class="fa-solid fa-location-dot"></i></div>
                <div class="service-contents"><p>Furniture Street, Design City</p></div>
              </div>
            </div>
            <div class="col-lg-4">
              <div class="service no-shadow align-items-center link horizontal d-flex active">
                <div class="service-icon color-1 mb-4"><i class="fa-solid fa-envelope"></i></div>
                <div class="service-contents"><p>support@furni.example</p></div>
              </div>
            </div>
            <div class="col-lg-4">
              <div class="service no-shadow align-items-center link horizontal d-flex active">
                <div class="service-icon color-1 mb-4"><i class="fa-solid fa-phone"></i></div>
                <div class="service-contents"><p>+91 90000 00000</p></div>
              </div>
            </div>
          </div>

          <form id="contact-form">
            <div class="row">
              <div class="col-6">
                <div class="form-group">
                  <label class="text-black" for="fname">First name</label>
                  <input type="text" class="form-control" id="fname" required>
                </div>
              </div>
              <div class="col-6">
                <div class="form-group">
                  <label class="text-black" for="lname">Last name</label>
                  <input type="text" class="form-control" id="lname" required>
                </div>
              </div>
            </div>
            <div class="form-group">
              <label class="text-black" for="email">Email address</label>
              <input type="email" class="form-control" id="email" required>
            </div>
            <div class="form-group mb-4">
              <label class="text-black" for="message">Message</label>
              <textarea class="form-control" id="message" cols="30" rows="5" required></textarea>
            </div>
            <p id="contact-message" class="mb-3"></p>
            <button id="contact-submit-btn" type="submit" class="btn btn-primary-hover-outline">Send Message</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer-section">
    <div class="container relative">
      <div class="sofa-img">
        <img src="{% static 'images/sofa.png' %}" alt="Image" class="img-fluid">
      </div>
    </div>
  </footer>

  <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'js/tiny-slider.js' %}"></script>
  <script src="{% static 'js/custom.js' %}"></script>
  <script src="{% static 'js/contact-page.js' %}"></script>
</body>
</html>
